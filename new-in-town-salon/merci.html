<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks — New in Town Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F1;--fg:#16121C;--accent:#7A3FA6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;line-height:1.7}
.card{max-width:44ch}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;margin-bottom:18px}
p{opacity:.75;margin-bottom:30px}
a{display:inline-block;background:var(--accent);color:var(--bg);text-decoration:none;
  font-weight:600;padding:15px 32px;border-radius:999px}
.back{background:none;color:var(--fg);opacity:.6;font-weight:400;padding:12px 0;display:block;margin-top:14px}
</style>
</head>
<body>
  <div class="card">
    <img src="img/logo.png" alt="New in Town Salon logo" width="400" height="400" style="width:88px;height:88px;border-radius:50%;margin:0 auto 24px;display:block;box-shadow:0 0 0 2px #E8A31E">
    <h1>Thanks — we've got it.</h1>
    <p>Your message has landed in our inbox. We'll come back to you as soon as we're out of the chair. If it's urgent, calling is always faster.</p>
    <a href="tel:+61416015242">Call 0416 015 242</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</body>
</html>
