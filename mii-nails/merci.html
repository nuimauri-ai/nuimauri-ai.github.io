<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d14">
<title>Thanks — Mii Nails &amp; Lashes</title>
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0d14;--pearl:#f3ecdf;--pink:#f28cae;--pink-ink:#0c0d14;--muted:#8d8a99;
  --glow:color-mix(in srgb,var(--pink) 28%,transparent);--hair:color-mix(in srgb,var(--pearl) 16%,transparent);--hair-2:color-mix(in srgb,var(--pearl) 9%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;font-weight:300;color:var(--pearl);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px;text-align:center;line-height:1.7;position:relative;
  background:radial-gradient(ellipse 70% 60% at 50% 110%,var(--glow),transparent 65%),var(--ink)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(var(--hair-2) 1px,transparent 1.4px);background-size:26px 26px}
.card{max-width:46ch;position:relative}
.badge{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto 26px;display:block;box-shadow:0 0 0 1px var(--hair),0 0 40px var(--glow)}
.badge img{width:100%;height:100%;object-fit:cover}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1;margin-bottom:20px}
h1 em{font-style:italic;color:var(--pink)}
p{color:var(--muted);margin-bottom:34px}
a.btn{display:inline-block;font-size:.76rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;
  padding:17px 34px;border-radius:2px;background:var(--pink);color:var(--pink-ink)}
a.back{display:block;margin-top:22px;color:var(--pearl);text-decoration:none;font-size:.72rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><img src="img/logo.png" alt="Mii Nails &amp; Lashes logo" width="400" height="400"></span>
    <h1>Thanks, <em>we've got it</em>.</h1>
    <p>Your message has landed in our inbox. We'll come back to you between clients. If you want a time today, calling is faster.</p>
    <a class="btn" href="tel:+61280184199">Call (02) 8018 4199</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</body>
</html>
