<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks — Salon D'Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
:root{--night:#0e090c;--gold:#d6a97c;--gold-ink:#0e090c;--cream:#f1e6d8;--muted:#9d8c93;
  --glow:color-mix(in srgb,var(--gold) 22%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'EB Garamond',Georgia,serif;background:radial-gradient(ellipse 60% 45% at 50% 0%,var(--glow),transparent 70%),var(--night);
  color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;line-height:1.75}
.card{max-width:46ch}
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:22px}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;margin-bottom:20px}
h1 em{color:var(--gold)}
p{color:var(--muted);margin-bottom:34px}
a.btn{display:inline-block;font-size:.78rem;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;
  padding:17px 34px;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink)}
a.back{display:block;margin-top:22px;color:var(--gold);text-decoration:none;font-size:.78rem;letter-spacing:.26em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Salon D'Art</span>
    <h1>Thanks, <em>we've got it</em>.</h1>
    <p>Your message has landed in our inbox. We'll come back to you as soon as we're out of the chair. If it's urgent, calling is always faster.</p>
    <a class="btn" href="tel:+61296872520">Call (02) 9687 2520</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</body>
</html>
