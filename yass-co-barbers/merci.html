<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d0c">
<title>Thanks — Yass &amp; Co Barbers</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,900;1,6..96,400&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0d0c;--bone:#ece5d8;--red:#b6382c;--red-ink:#ece5d8;--muted:#8f8b83;
  --red-glow:color-mix(in srgb,var(--red) 30%,transparent);--hair-2:color-mix(in srgb,var(--bone) 8%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Caslon Text',Georgia,serif;color:var(--bone);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px;text-align:center;line-height:1.75;position:relative;
  background:radial-gradient(ellipse 70% 60% at 50% 110%,var(--red-glow),transparent 65%),var(--ink)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(-45deg,transparent 0 46px,var(--hair-2) 46px 48px)}
.card{max-width:46ch;position:relative}
.badge{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto 26px;display:block;background:var(--bone);box-shadow:0 0 0 3px var(--red)}
.badge img{width:100%;height:100%;object-fit:cover}
h1{font-family:'Bodoni Moda',serif;font-weight:900;font-size:clamp(2.4rem,7vw,4rem);line-height:1;margin-bottom:20px}
h1 em{font-style:italic;font-weight:400;color:var(--red)}
p{color:var(--muted);margin-bottom:34px}
a.btn{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;
  padding:18px 36px;border-radius:999px;background:var(--red);color:var(--red-ink)}
a.back{display:block;margin-top:22px;color:var(--bone);text-decoration:none;font-size:.74rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><img src="img/logo.png" alt="Yass &amp; Co Barbers logo" width="400" height="400"></span>
    <h1>Thanks, <em>we've got it</em>.</h1>
    <p>Your message has landed in our inbox. We'll come back to you between cuts. If you want a chair today, calling is faster.</p>
    <a class="btn" href="tel:+61283869020">Call (02) 8386 9020</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</body>
</html>
