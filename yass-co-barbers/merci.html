<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<title>Thanks — Yass & Co Barbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Roboto+Slab:wght@300;700&display=swap" rel="stylesheet">
<style>
/* Même palette et mêmes polices que index.html (ZONE B) */
:root{
  --black:#0A0A0A; --paper:#FFFFFF; --gold:#C9A227; --gold-soft:#E3C567; --dim:#A29B90;
  --display:'Alfa Slab One','Rockwell',Georgia,serif;
  --body:'Roboto Slab',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);font-weight:300;background:var(--black);color:var(--paper);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
  text-align:center;line-height:1.75}
.card{max-width:46ch}
.logo{display:block;width:88px;height:88px;margin:0 auto 26px;border-radius:50%;overflow:hidden;
  background:var(--paper);box-shadow:0 0 0 2px var(--gold)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1.12;
  font-size:clamp(1.8rem,6vw,2.8rem);margin-bottom:18px}
p{color:var(--dim);margin-bottom:30px}
a.btn{display:inline-block;background:var(--gold);color:var(--black);text-decoration:none;
  font-family:var(--body);font-weight:700;letter-spacing:0.04em;padding:15px 32px;border-radius:999px}
a.btn:hover{background:var(--gold-soft)}
.back{display:block;margin-top:16px;color:var(--dim);text-decoration:none;font-size:0.9rem}
.back:hover{color:var(--gold-soft)}
</style>
</head>
<body>
  <div class="card">
    <span class="logo"><img src="img/logo.png" alt="Yass &amp; Co Barbers logo" width="400" height="400"></span>
    <h1>Thanks — we've got it.</h1>
    <p>Your message has landed in our inbox. We'll come back to you as soon as we're out of the chair. If it's urgent, calling is always faster.</p>
    <a class="btn" href="tel:+61283869020">Call (02) 8386 9020</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</body>
</html>
